# Configuração do Alembic, a ferramenta das migrações do banco. Seção 8 do SDD.
# Rode os comandos em apps/api, por exemplo: uv run alembic upgrade head.
# A lista das revisões e os comandos de upgrade e downgrade estão em alembic/README.md.
# Comentários ficam em linhas próprias, começando na coluna 1: para o ConfigParser, um # no
# fim de uma linha de valor viraria parte do valor.

[alembic]
# Pasta com o env.py e as revisões em versions/, relativa à pasta de onde o comando roda.
script_location = alembic
# Põe a pasta atual no sys.path, para o env.py e as revisões importarem o pacote app.
prepend_sys_path = .
# Separa as listas de caminho deste arquivo, como prepend_sys_path, com o separador do sistema
# operacional (os.pathsep).
path_separator = os
# Marcador sem uso. O alembic/env.py ignora uma URL que começa com driver:// e lê o
# DATABASE_URL do ambiente ou do .env. Os testes de integração trocam este valor pela URL do
# banco local, por código.
sqlalchemy.url = driver://user:pass@localhost/dbname

# As seções abaixo configuram o logging do Python durante os comandos. O env.py as lê com
# logging.config.fileConfig. Há só o logger raiz, em WARN: as linhas INFO do Alembic, como
# "Running upgrade", não aparecem.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

# Escreve na saída de erro (sys.stderr).
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
