[project]
name = "atrium-api"
version = "0.1.0"
description = "API do Atrium"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "langchain-google-genai>=4.4.2",
  "langsmith>=0.14.14",
  "pydantic-settings>=2.6",
  "pypdf>=6.21.3",
  "python-ulid>=3.0",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: precisa de PostgreSQL com pgvector; a CI sobe o contêiner",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "alembic", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "ulid.*"
ignore_missing_imports = true
