name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: atrium
          POSTGRES_PASSWORD: atrium
          POSTGRES_DB: atrium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atrium -d atrium -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://atrium:atrium@127.0.0.1:5432/atrium
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          working-directory: apps/api
      - name: Instalar dependências
        working-directory: apps/api
        run: uv sync --frozen
      - name: Ruff
        working-directory: apps/api
        run: uv run ruff check
      - name: mypy
        working-directory: apps/api
        run: uv run mypy
      - name: Pytest
        working-directory: apps/api
        run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Instalar dependências
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: apps/web
        run: pnpm exec eslint .
      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit -p tsconfig.app.json && pnpm exec tsc --noEmit -p tsconfig.node.json
      - name: Vitest
        working-directory: apps/web
        run: pnpm test
      - name: Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
      - name: Build
        working-directory: apps/web
        run: pnpm build
      - name: Build do Storybook
        working-directory: apps/web
        run: pnpm build-storybook

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          working-directory: apps/api
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Instalar a API
        working-directory: apps/api
        run: uv sync --frozen
      - name: Instalar o frontend
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Gerar o OpenAPI
        working-directory: apps/api
        run: uv run python -m app.scripts.export_openapi
      - name: Gerar os tipos
        working-directory: apps/web
        run: pnpm openapi-types
      - name: Conferir o contrato
        run: git diff --exit-code -- apps/web/src/lib/api/openapi.json apps/web/src/lib/api/schema.ts
